services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=code_compass'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_USER=meet'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
