spring:
  application:
    name: server
  ai:
    model:
      embedding: ollama
      chat: ${CHAT_MODEL}
    ollama:
      embedding:
        model: ${EMBEDDING_MODEL}
  datasource:
    url: ${POSTGRES_URL}
    password: ${POSTGRES_PASSWORD}
    username: ${POSTGRES_USER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    generate-ddl: off
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
logging:
  level:
    com.meet.server.feature.repositoryfile.RepositoryFileProcessor: DEBUG

app:
  env: dev
  cors:
    allowed-origins: ${ALLOWED_ORIGIN}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  auth:
    refresh-token-cleanup-cron: "${REFRESH_TOKEN_CLEANUP_CRON:0 0 * * * *}"

jwt:
  secret: ${JWT_SECRET}
